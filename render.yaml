services:
  - type: worker
    name: dot-rider-shuttle-bots
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bots.py
    envVars:
      - key: STUDENT_BOT_TOKEN
        sync: false
      - key: DRIVER_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
